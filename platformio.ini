; HomePuck — ESP32-2424S012 round display + OpenPlotter SignalK
; Same WiFi/SignalK stack as OpenRemote e-ink dashboard

[platformio]
default_envs = esp32-2424s012

[env:esp32-2424s012]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5

build_src_filter = +<*> +<wifi/> +<signalk/> +<display/> -<ui/>

build_flags =
    -I include
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_LCD_SCLK=6
    -DPIN_LCD_MOSI=7
    -DPIN_LCD_DC=2
    -DPIN_LCD_CS=10
    -DPIN_LCD_BL=3

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.0
    fbiego/CST816S@^1.1.1
